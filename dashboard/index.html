<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Wraith C2 Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #e2e8f0; }
        .card { background-color: #1e293b; border: 1px solid #334155; }
    </style>
</head>
<body class="p-8">
    <div class="max-w-6xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-white">Wraith <span class="text-blue-500">C2</span></h1>
            <div id="status" class="text-sm text-slate-400">Connected to API: 127.0.0.1:8000</div>
        </header>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <!-- Agents List -->
            <div class="md:col-span-1 card p-6 rounded-lg shadow-xl">
                <h2 class="text-xl font-semibold mb-4 border-b border-slate-700 pb-2">Active Agents</h2>
                <ul id="agent-list" class="space-y-2">
                    <li class="text-slate-500 italic">Loading agents...</li>
                </ul>
            </div>

            <!-- Agent Control -->
            <div class="md:col-span-2 card p-6 rounded-lg shadow-xl">
                <h2 class="text-xl font-semibold mb-4 border-b border-slate-700 pb-2">Agent Control</h2>
                <div id="control-panel" class="hidden">
                    <div class="flex items-center justify-between mb-4">
                        <span id="selected-agent" class="text-blue-400 font-mono">No agent selected</span>
                        <button onclick="clearSelection()" class="text-xs text-slate-500 hover:text-slate-300">Clear</button>
                    </div>
                    
                    <div class="flex gap-2 mb-6">
                        <input type="text" id="cmd-input" placeholder="Enter command (e.g. shell whoami)" 
                               class="flex-1 bg-slate-900 border border-slate-700 rounded px-3 py-2 text-white focus:outline-none focus:border-blue-500">
                        <button onclick="sendTask()" class="bg-blue-600 hover:bg-blue-500 text-white px-4 py-2 rounded font-medium transition">Send Task</button>
                    </div>

                    <h3 class="text-lg font-medium mb-2">Task History</h3>
                    <div id="task-list" class="space-y-2 max-h-96 overflow-y-auto">
                        <p class="text-slate-500 italic">No tasks for this agent.</p>
                    </div>
                </div>
                <div id="no-selection" class="text-center py-12 text-slate-500">
                    Select an agent from the list to begin control.
                </div>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://127.0.0.1:8000';
        let selectedAgentId = null;

        async function fetchAgents() {
            try {
                const resp = await fetch(`${API_BASE}/agents`);
                const agents = await resp.json();
                const list = document.getElementById('agent-list');
                list.innerHTML = '';
                
                agents.forEach(a => {
                    const li = document.createElement('li');
                    li.className = `p-2 rounded cursor-pointer transition ${selectedAgentId === a.id ? 'bg-blue-900/40 text-blue-300 border border-blue-700' : 'hover:bg-slate-800 text-slate-300'}`;
                    li.textContent = a.id;
                    li.onclick = () => selectAgent(a.id);
                    list.appendChild(li);
                });
            } catch (e) {
                console.error('Failed to fetch agents', e);
            }
        }

        async function selectAgent(id) {
            selectedAgentId = id;
            document.getElementById('selected-agent').textContent = `Agent: ${id}`;
            document.getElementById('control-panel').classList.remove('hidden');
            document.getElementById('no-selection').classList.add('hidden');
            fetchAgents(); // Refresh list styles
            fetchTasks();
        }

        function clearSelection() {
            selectedAgentId = null;
            document.getElementById('control-panel').classList.add('hidden');
            document.getElementById('no-selection').classList.remove('hidden');
            fetchAgents();
        }

        async function fetchTasks() {
            if (!selectedAgentId) return;
            try {
                const resp = await fetch(`${API_BASE}/tasks/agent/${selectedAgentId}`);
                const tasks = await resp.json();
                const list = document.getElementById('task-list');
                list.innerHTML = '';

                tasks.forEach(t => {
                    const div = document.createElement('div');
                    div.className = 'p-3 rounded bg-slate-900 border border-slate-800 text-sm';
                    const statusColor = t.status === 'completed' ? 'text-green-400' : (t.status === 'failed' ? 'text-red-400' : 'text-yellow-400');
                    div.innerHTML = `
                        <div class="flex justify-between mb-1">
                            <span class="font-mono text-xs text-slate-500">${t.id}</span>
                            <span class="${statusColor} font-bold text-xs uppercase">${t.status}</span>
                        </div>
                        <div class="text-white font-medium">${t.command}</div>
                        <div class="text-slate-400 mt-2 p-2 bg-black rounded text-xs whitespace-pre-wrap">${t.result || 'Waiting for result...'}</div>
                    `;
                    list.appendChild(div);
                });
            } catch (e) {
                console.error('Failed to fetch tasks', e);
            }
        }

        async function sendTask() {
            const input = document.getElementById('cmd-input');
            const cmd = input.value;
            if (!cmd || !selectedAgentId) return;

            try {
                const resp = await fetch(`${API_BASE}/tasks`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        agent_id: selectedAgentId,
                        command: cmd
                    })
                });
                if (resp.ok) {
                    input.value = '';
                    fetchTasks();
                }
            } catch (e) {
                console.error('Failed to send task', e);
            }
        }

        setInterval(fetchAgents, 5000);
        setInterval(fetchTasks, 3000);
        fetchAgents();
    </script>
</body>
</html>
